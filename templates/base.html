<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Batch Reactor Anomaly Detection{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                Batch Reactor AI
            </a>

            <!-- Navbar toggle untuk mobile -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/anomaly">
                            Anomaly Detection
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/reactor-control">
                            Reactor Control
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/about">
                            About
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">

        <div class="container">

            <p class="mb-1 fw-semibold">
                Batch Reactor Anomaly Detection
            </p>

            <small class="text-secondary">
                Machine Learning Based Industrial Monitoring
            </small>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Main JavaScript -->
    <script
        src="{{ url_for('static', filename='js/main.js') }}">
    </script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
